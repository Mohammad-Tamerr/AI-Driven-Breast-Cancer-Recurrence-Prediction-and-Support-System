services:
  rafeek-bot:
    build:
      context: ./RafeekBot
      dockerfile: Dockerfile
    container_name: rafeek-bot-backend
    ports:
      - "8080:8080"
    environment:
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - ./data:/app/../data:ro
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped
    networks:
      - default
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data:
  hf_cache:
